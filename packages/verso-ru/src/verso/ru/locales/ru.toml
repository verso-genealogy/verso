layer_diff_description = """Записать наименьший слой имён над базой, который отвечает на каждый вопрос оракула так же, как старые таблицы каталога DIR (names.csv, names_ignore.csv, patronymics_ignore.csv).

Оракул — файл TSV, строка на вопрос: function<TAB>args_json<TAB>answer_json. Строка с # в начале — комментарий. function — имя функции именования без модуля (canonicalize_name, matching_base, derive_patronymic …); args_json — JSON-список всех её параметров по порядку, с умолчаниями, пол — "M", "F" или null; answer_json — ответ в той же записи или {{"raises": "<класс исключения>"}}.

Слой — три файла TSV (names.tsv, forms.tsv, patronymics.tsv) в --out, источник каждой записи — «legacy» (имя старого списка игнорирования сохраняет «ignore»: это его метка); одни и те же входы пишут одни и те же байты. Код 1 — вопросы, которых не решает ни одна запись старых таблиц, перечислены; слой записан всё равно."""
