[cli.names]
layer_diff_help = "write the smallest layer over a base that answers an oracle's questions as the old tables do"
layer_diff_description = """Write the smallest names layer over a base that answers every question of an oracle as the old tables of DIR (names.csv, names_ignore.csv, patronymics_ignore.csv) answer it.

The oracle is a TSV file, one row a question: function<TAB>args_json<TAB>answer_json. A line starting with # is a comment. The function is the bare name of a naming function (canonicalize_name, matching_base, derive_patronymic …); args_json is the JSON list of all its parameters in order, defaults applied, a sex written "M", "F" or null; answer_json is the answer in the same notation, or {{"raises": "<the exception's class>"}}.

The layer is three TSV files (names.tsv, forms.tsv, patronymics.tsv) in --out, every entry's source «legacy» (a name of the old ignore list keeps «ignore», which is what marks it); the same inputs write the same bytes. Exit 1: questions no entry of the old tables settles, listed — the layer is written all the same."""
