[CAI003]
zero = "{who}: age=0 puts the birth in the census year — if the source states no age, omit age= (a missing age is treated as unknown and emits no birth event)"

[CAI004]
departed = "{who}: {why} before the revision and so left the parish — the source states no current age. Move the figure to previous_age= or drop it (age= here asserts a column the сказка leaves empty)"

[CAI005]
departed = "{who}: {why} before the revision, so the source gives no birth year — drop birth_year= and let previous_age= carry it (the derived estimate spells the two-year window the age really means)"

[CAI001]
with_year = "{who}: birth_day/birth_month set without birth_year, so the birth defaults to the census year {year} — but age {age} makes the member ~{years} yrs old (born ~{born}). Add birth_year= or drop birth_day/birth_month."
without_year = "{who}: birth_day/birth_month set without birth_year, so the birth defaults to the census year — but age {age} makes the member ~{years} yrs old. Add birth_year= or drop birth_day/birth_month."

[CAI002]
gap = "{who}: age {age} vs previous_age {previous} differ by {diff} years, but the {year} census is {gap} years after the previous ({previous_year}) revision — check the transcribed ages."

[CPL008]
same_ref = "{who}: secondary_ref_member={sec} names the same member as ref_member={ref}. The secondary axis is for a relationship the source's own role does NOT describe; aimed at the member `ref_member` already names it restates one, and it restates it the expensive way — the translator mints a geni_union from that axis, duplicating the one the `ref_member` path already emits. Use {axis}={ref} instead: same claim, read by the facts extractor, and no generated byte moves."

[CPL007]
role_none = "{who}: role=None with ref_member={ref} and nothing saying what {ref} IS. Without a role the reference is read as a spouse by one pass of the generator and as a parent by another, so the meaning survives only in a comment. Add spouse_member={ref} (husband/wife) or parent_member={ref} (father/mother) beside it — `ref_member` stays as it is and no generated byte moves. `secondary_role=<role>` + secondary_ref_member={ref} also settles it, and additionally emits the union for that relationship — use it when you want the union, not merely to say what the reference means."

[CPL011]
hidden_partner = "{who}: hidden parent of member(s) {numbers} with ref_member={ref} — the translator makes {partner} the CO-PARENT of those children (the hidden-ancestor pass reads a hidden parent's ref_member as his spouse for every role but SON/DAUGHTER/STEPSON/STEPDAUGHTER), {why}. An absent brother of the head needs no ref_member (the head-of-family stub makes them siblings); a dead husband whose widow is listed is role=None with ref_member and spouse_member naming HER."
one_sex = "and the two are of one sex"
head_blood = "and the role makes this member the head's {role}, not the head's spouse"

[CPL009]
no_such_member = "{who}: {kw}={ref} names a member number that does not exist in this household (it has {numbers}) — member references resolve against the household's OWN numbering, so the translator looks {ref} up, finds nothing and emits no union: the link is a silent no-op, and no sibling check sees it either — each of those reads the reference's resolved TARGET, and a number that misses has none. If that member number belongs to a NEIGHBOURING household, the reference is a copy-paste or a survivor of a household split — a parent who genuinely lives in another household is linked with father_ref=\"<consolidated profile name>\"; otherwise remove it."

[CPL010]
number_taken = "{who}: the number is already taken by {earlier}, earlier in this household — a household's member numbers are the keys every reference resolves through, and the map keeps the LAST member of a number: a reference to it reaches this one, the earlier member drops out of every check that walks the household (CPL001–CPL009 included), and the facts layer reads both as ONE appearance with two names. Renumber from the roll's own numbering on the scan, and move any reference that meant the other member."

[CPL006]
ref_hidden = "{who}: ref_member={ref} points at a HIDDEN member — `ref_member` states the relationship the SOURCE records, so it can only name someone the source wrote down. Point it at the visible relative the document names and add parent_member={ref} for the reconstructed lineage."

[CPL005]
hidden_leaf = "{who}: hidden=True member that links to nobody — nothing references them as parent/spouse and they reference no in-household relative. A hidden member is only justified by the connection it makes, so this one adds an unattested person for no purpose (the shape of a member invented to father someone, left dangling once that link was corrected). Verify they are attested elsewhere in the corpus — the «добавлена вручную по другим материалам» comment is NOT evidence, fabricated and well-sourced members carry it alike — otherwise remove them."

[CPL004]
invented_parent = "{who}: married-in {role} with parent_member={pm}, which is {rel} — this makes her a blood relative of the man she married. A woman who married INTO the household has no parent here; her patronymic matching a household member's name is NOT evidence (that coincidence is what produced the mis-links this check exists for). Drop parent_member unless he is genuinely her own father living in this household."
own_husband = "her own husband"
husband_ancestor = "an ancestor of her husband (member {husband})"
husband_sibling = "a sibling of her husband (member {husband})"

[CPL001]
no_parent_link = "{who}: {role} with ref_member={rm} resolves to NO parent link — the parent-child union is silently dropped (only SON/DAUGHTER treat ref_member as the parent), yet {target_txt} looks like the father ({evidence}). Fix one: (a) source says «сынъ»/«дочь» → the role should be SON/DAUGHTER; (b) {target_txt} IS the father → add parent_member={rm}; (c) ref_member names a relationship anchor and the match is a coincidence → keep as-is."
evidence_patronymic = "patronymic «{patronymic}» matches a patronymic derived from «{father}»"
evidence_comment = "the comment says «сын/дочь»"
evidence_derived = "the patronymic is auto-derived from member {member}"

[CPL002]
no_father = "{who}: {role} has no father in the household and no parent_member — the profile is emitted attached to NO union. If the father is identifiable{hint}, add a hidden=True intermediary member and point parent_member= at it; otherwise keep as-is."
hint = " — the patronymic «{patronymic}» names him"

[CPL003]
no_husband = "{who}: DAUGHTER_IN_LAW («сноха») with no husband in the household — her marriage is not represented (Rule A needs exactly one deceased SON of HEAD; found {dead_sons}). Add a hidden=True husband with ref_member={my_num}, or keep as-is if he is unidentifiable."

