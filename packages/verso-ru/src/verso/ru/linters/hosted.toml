# Each linter code's readiness for records JSON (L10 part 2; read by `hosted.py`).
# class: written | derived | context | source (the form of the text alone; a redundant kwarg —
# a written value equal to the one it inherits — is written + derived, and JSON keeps both); severity: refuse (hard) | warn (advisory);
# needs (context; and any code that reads a table all the same — one that reads a name, or replays the file, which builds its
# persons from the names table): names, places, estates, book, file; as: the keyword code a positional one folds into
# (the rule of that code answers both); forms: the variants that say the form of an argument and nothing else (see hosted.py).
# redundant: true on a derived code whose finding is a redundant argument (a written value equal to the one it
# inherits), and on a positional code that folds into one (`as`); absent, false.
# scope: where the code is answered (`hosted.py`): record (one record, or one двор, with its set's header —
# `lint_record`; a finding the same rule addresses to the set itself is `lint_header`'s), set (the set's header
# alone — `lint_header`), file (a record needs one fact of the whole file, `file_in_scope` — ULC001), source
# (the text of the source: no JSON answers it), layer (a names layer's files, read in the sum of the layers under
# it — no record is read: the LEX codes, `checks/lexicon.py`).
# One row per code of codes.LINTER_CODES.

[SLC001]
class = "source"
severity = "refuse"
scope = "source"
note = "a person() call spans several lines (line wrapping of the source)"

