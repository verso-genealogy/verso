# ru-v2 — the profile of the names a person reads: BGN/PCGN without apostrophes, with five
# changes for genealogy (the maintainers' rulings): -ий/-ый → -y, -ия → -ia, е → e
# everywhere but after ь/ъ, ё → yo (o after ж ч ш щ), ъ and ь dropped. Pre-reform letters are
# the profile's own rules: ѣ as е, і → i, ѳ → f, ѵ → i.
#
# Frozen by its hash (tests/test_transliteration.py): a changed letter is a new profile, ru-v3.
# Keys are small letters; the case of the source letter carries over.
name = "ru-v2"
strip = "́"

# Whole names (a ruling of the maintainers): five that ru-v1 already spelled the
# English way, and three the books write with е for ё. A name of this table is spelled whole wherever it
# stands as a word; its patronymic is spelled by letters (Семенович → Semenovich).
[names]
"Алексей" = "Alexey"
"Артем" = "Artyom"
"Еремей" = "Yeremey"
"Емельян" = "Yemelyan"
"Максим" = "Maxim"
"Петр" = "Pyotr"
"Семен" = "Semyon"
"Федор" = "Fyodor"

[chars]
"а" = "a"
"б" = "b"
"в" = "v"
"г" = "g"
"д" = "d"
"е" = "e"
"ё" = "yo"
"ж" = "zh"
"з" = "z"
"и" = "i"
"й" = "y"
"к" = "k"
"л" = "l"
"м" = "m"
"н" = "n"
"о" = "o"
"п" = "p"
"р" = "r"
"с" = "s"
"т" = "t"
"у" = "u"
"ф" = "f"
"х" = "kh"
"ц" = "ts"
"ч" = "ch"
"ш" = "sh"
"щ" = "shch"
"ъ" = ""
"ы" = "y"
"ь" = ""
"э" = "e"
"ю" = "yu"
"я" = "ya"
"ѣ" = "e"
"і" = "i"
"ѳ" = "f"
"ѵ" = "i"

[initial]

[after_sign]
"е" = "ye"
"ё" = "yo"
"и" = "yi"
"ю" = "yu"
"я" = "ya"
"ѣ" = "ye"
"і" = "yi"

[after_hushing]
"ё" = "o"

[final]
"ий" = "y"
"ый" = "y"
"ия" = "ia"
