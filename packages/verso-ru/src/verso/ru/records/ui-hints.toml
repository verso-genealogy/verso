# The Russian books' hints for the review page's schema (verso.core.records.ui): what the
# vocabulary does not say — the order of a record's fields, their labels (keys of verso.ru's
# catalogs, `ui.*`), the slot a record's field is drawn beside, the dates, the references inside a
# record, the slots' gender, the drafts, a book's defaults — and nothing the vocabulary does: a
# field's type is its row's. `python -m verso.core.records.ui --write` builds ui-v1.json beside it.
schema = 1

[person]
fields = [
  { path = "given.original", label = "ui.field.given_original", column = true, suggest = true },
  { path = "patronymic.original", label = "ui.field.patronymic_original", column = true, suggest = true },
  { path = "surname.original", label = "ui.field.surname_original", column = true, suggest = true },
  { path = "status", label = "ui.field.status", line = true, suggest = true },
  { path = "residence", label = "ui.field.residence", line = true, suggest = true },
  { path = "given.modern", label = "ui.field.given_modern" },
  { path = "patronymic.old", label = "ui.field.patronymic_old" },
  { path = "surname.modern", label = "ui.field.surname_modern" },
  { path = "gender", label = "ui.field.gender" },
  { path = "side", label = "ui.field.side" },
  { path = "comment", label = "ui.field.comment", widget = "wide" },
  { path = "surname.in_book", label = "ui.field.surname_in_book", auto = true },
  { path = "maiden_surname.modern", label = "ui.field.maiden_surname_modern", offer = { gender = "female", not_in = ["child"] } },
  { path = "occupation", label = "ui.field.occupation" },
]
hidden = [
  "patronymic.modern",
  "status_defaulted",
]

[kinds.birth]
label = "ui.kind.birth"
fields = [
  { path = "number", label = "ui.field.number" },
  { path = "gender", label = "ui.field.gender" },
  { path = "birth.day", label = "ui.field.birth_day" },
  { path = "baptism.day", label = "ui.field.baptism_day" },
  { path = "birth.month", label = "ui.field.birth_month" },
  { path = "baptism.month", label = "ui.field.baptism_month" },
  { path = "page", label = "ui.field.page" },
  { path = "case", label = "ui.field.case" },
  { path = "comment", label = "ui.field.comment", widget = "wide" },
  { path = "year", label = "ui.field.year" },
  { path = "baptism.year", label = "ui.field.baptism_year" },
  { path = "source_date_error", label = "ui.field.source_date_error", checks = true },
  { path = "calendar_note", label = "ui.field.calendar_note_birth", checks = true },
  { path = "lag_note", label = "ui.field.lag_note_birth", checks = true },
]
hidden = [
  "civil",
  "reviewed",
  "baptism.age",
  "inventory",
  "book",
]
slots = [
  { role = "child", label = "ui.slot.child", gender = "of_record" },
  { role = "father", label = "ui.slot.father", gender = "male" },
  { role = "mother", label = "ui.slot.mother", gender = "female" },
  { role = "godparent", label = "ui.slot.godparent", quick = "ui.quick.godparent" },
  { role = "priest", label = "ui.slot.priest", gender = "male" },
  { role = "deacon", label = "ui.slot.deacon", gender = "male" },
  { role = "dyachok", label = "ui.slot.dyachok", gender = "male" },
  { role = "sexton", label = "ui.slot.sexton", gender = "male" },
]

[[kinds.birth.groups]]
name = "relatives"
label = "ui.group.relatives"
orderable = true
fields = [
  { path = "relationship", label = "ui.field.relationship" },
  { path = "relationship_ref", label = "ui.field.relationship_ref", ref = { to = "slot", choices = [{ role = "mother", word = "мать", label = "ui.ref.mother" }, { role = "godparent", word = "восприемника №{n}", label = "ui.ref.godparent" }] } },
]
hidden = []

[[kinds.birth.events]]
label = "ui.event.birth"
of = "ui.event.of_birth"
day = "birth.day"
month = "birth.month"
year = "year"

[[kinds.birth.events]]
label = "ui.event.baptism"
day = "baptism.day"
month = "baptism.month"
year = "baptism.year"

[kinds.birth.draft]
creatable = true
slots = ["child", "father", "mother"]

