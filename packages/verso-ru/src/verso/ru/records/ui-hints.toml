# ---------------------------------------------------------------- the page's rules
# What the page computes as the reader types — a pure function of the record's own fields — declared
# here and held to the library's own answer (verso-app: tests/golden/ui/rules.json, docs/derived.md).
# Anything that needs the corpus, the book or the library's derivations is the server's (`derived`).

# The christening's month follows the birth's until the reader sets it — the next month when its day
# is the smaller (`Birth.__init__`); a burial's follows the death's, and never advances (the library's).
[[kinds.birth.rules]]
rule = "follows"
from = "birth.month"
to = "baptism.month"
advance = { day_from = "birth.day", day_to = "baptism.day" }

[[kinds.death.rules]]
rule = "follows"
from = "death.month"
to = "burial.month"

# A christening twelve days or more after the birth, a burial four or more after the death: the
# baptism-lag and burial-lag checks' thresholds (`verso.ru.facts.checks.lags`). The page says no
# warning where the record writes the field that stands the check down (`verso.ru.facts.signals`
# STAND_DOWN): `lag_note` for a late one, `source_date_error` for one before the birth or the death.
[[kinds.birth.rules]]
rule = "late"
after = 0
event = 1
days = 12
stand_down = "lag_note"
stand_down_before = "source_date_error"

[[kinds.death.rules]]
rule = "late"
after = 0
event = 1
days = 4
stand_down = "lag_note"
stand_down_before = "source_date_error"

# Whose relative one is: the people the record holds, as the source words it (`ref.choices`).
[[kinds.birth.rules]]
rule = "ref_choices"
group = "relatives"
path = "relationship_ref"

[[kinds.christening.rules]]
rule = "ref_choices"
group = "relatives"
path = "relationship_ref"

[[kinds.marriage.rules]]
rule = "ref_choices"
group = "relatives"
path = "relationship_ref"
party = "side"  # the field holding the party a surety stood for

# A roll's member is asked the previous revision's age where the roll writes it — a woman only where
# the roll writes it for women (`census_records(female_previous_age=)`, the book's reading).
[[kinds.household.rules]]
rule = "shown_when"
group = "members"
path = "previous_age"
when = { book = "previous_age", women = "female_previous_age", gender_of = "role" }

# A member renumbered takes the references naming it along.
[[kinds.household.rules]]
rule = "renumber"
group = "members"
number = "number"
refs = ["ref_member", "parent_member", "spouse_member", "secondary_ref_member"]
