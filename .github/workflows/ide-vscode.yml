name: VS Code extension (vscode-dsllint)

# A new push to a PR cancels the run it supersedes, a push to main never does: the Actions minutes
# are a budget.

on:
  push:
    branches: [ main ]
    paths:
      - 'ide/vscode-dsllint/**'
      - '.github/workflows/ide-vscode.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ide/vscode-dsllint/**'
      - '.github/workflows/ide-vscode.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: tsc + mocha
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ide/vscode-dsllint

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ide/vscode-dsllint/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc --noEmit)
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Tests (mocha)
        run: npm test
