name: Publish

# The library's two distributions — verso-core, verso-ru — built from this repo and published by
# trusted publishing (no token: the OIDC identity of each distribution's environment,
# `<index>-<distribution>`), then installed from the index and run on the toy example.
# - A release tag `vX.Y.Z` (protected: only the maintainer pushes one) publishes the release
#   commit's own version to PyPI, under `pypi-verso-core` and `pypi-verso-ru`, which take the
#   maintainer's approval.
# - By hand (`workflow_dispatch`): a trial at a dev version on TestPyPI, under
#   `testpypi-verso-core` and `testpypi-verso-ru`.
# The scan of the built artifacts against a corpus's words needs that corpus, so it is the corpus's
# own (`tools/public_tree --artifacts`), run on a build before a release is tagged.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      index:
        description: 'Where to publish'
        type: choice
        options: ['testpypi']
        default: 'testpypi'

jobs:
  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      index: ${{ steps.version.outputs.index }}
    steps:
      - uses: actions/checkout@v7

      # A tag publishes the version its release commit stamped (`make stamp`), to PyPI. A trial is one
      # version an attempt: re-running the whole workflow uploads a new one rather than clashing with
      # the last; re-running verify alone reads this job's output from its attempt.
      - name: Version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = push ]; then
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "index=pypi" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0.dev$(( GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT ))" >> "$GITHUB_OUTPUT"
            echo "index=testpypi" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.16"
          enable-cache: true

      # The tag's commit already carries its version: a tag on a commit that does not is refused here,
      # before anything is built.
      - name: The tag names the stamped version
        if: steps.version.outputs.index == 'pypi'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for p in packages/verso-core packages/verso-ru; do
            got=$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' "$p/pyproject.toml")
            [ "$got" = "$VERSION" ] || { echo "::error::$p: version $got, the tag says $VERSION"; exit 1; }
          done

      - name: Stamp the trial's version into both distributions
        if: steps.version.outputs.index == 'testpypi'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 tools/release.py stamp "$VERSION"

      - name: Build wheels and sdists
        run: make build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  # One job a distribution, each under an environment of its own (`<index>-<distribution>`): an index
  # takes one pending publisher a configuration, and owner, repository, workflow and environment are the
  # whole configuration — so the two projects could not both be registered under one environment.
  publish:
    name: Publish ${{ matrix.dist }} to ${{ needs.build.outputs.index }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dist: verso-core
            files: verso_core
          - dist: verso-ru
            files: verso_ru
    environment: ${{ needs.build.outputs.index }}-${{ matrix.dist }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # Its own wheel and sdist alone: the other project's files would be refused by this publisher.
      - name: This distribution's files
        env:
          FILES: ${{ matrix.files }}
        run: |
          mkdir own
          mv dist/"${FILES}"-* own/
          ls own

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: own/
          repository-url: ${{ needs.build.outputs.index == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}

  verify:
    name: Install from ${{ needs.build.outputs.index }} and run the example
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
      SIMPLE: ${{ needs.build.outputs.index == 'pypi' && 'https://pypi.org/simple/' || 'https://test.pypi.org/simple/' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.16"

      # Only verso comes from the index it was published to, without its dependencies; the index takes
      # a while to show a new upload, so the download is retried for five minutes.
      - name: Download verso from the index
        run: |
          for attempt in $(seq 1 30); do
            pip download --no-deps --index-url "$SIMPLE" "verso-core==$VERSION" "verso-ru==$VERSION" -d wheels/ && exit 0
            echo "attempt $attempt: not on the index yet"
            sleep 10
          done
          exit 1

      # The two downloaded wheels by path, so no index can stand in for them; everything else
      # from PyPI, as a user would install it.
      - name: Install into a clean venv
        run: |
          uv venv verify-venv
          uv pip install --python verify-venv/bin/python \
            "$(ls wheels/verso_core-*.whl)[schema]" "$(ls wheels/verso_ru-*.whl)[xlsx,dsl-tools]"

      - name: The installed console script answers
        run: verify-venv/bin/verso --help

      - name: Run the toy example on the installed wheels
        run: |
          mkdir ex
          git archive HEAD:examples | tar -x -C ex/
          verify-venv/bin/python ex/run.py
