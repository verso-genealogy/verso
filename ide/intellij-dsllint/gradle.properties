pluginGroup = com.genealogy.dsllint
pluginName = intellij-dsllint
pluginVersion = 0.3.8

# platformType is gone: pycharm() takes no type code. JetBrains stopped
# publishing PyCharm Community (PC) as a separate artifact at 2025.3.
# We compile against the since-build floor and let verifyPlugin prove the newer ones.
platformVersion = 2025.3
pluginSinceBuild = 253
# PyCharm builds `verifyPlugin` checks against: the floor and the newest EAP.
# An EAP is pinned by build number (the "2026.3" installer only exists at release);
# swap it for "2026.3" once that ships.
pluginVerifyVersions = 2025.3, 263.5701.41

kotlin.code.style = official
# Use the Kotlin stdlib bundled with the IntelliJ Platform instead of bundling our
# own. Bundling a second stdlib pins it to the plugin classloader and can break
# restart-free (dynamic) unload/upgrade. See https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false
org.gradle.jvmargs = -Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel = true
org.gradle.caching = true
