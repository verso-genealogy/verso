# синтетический корпус тестов — ни одной записи настоящего.
# Владельцы и приходы (verso.core.corpus_data.estates — estate_of, estate-conflicts, RTV001/RTV002):
# у каждой таблицы — роль, которую проверяют тесты, и выдуманные владельцы.

# Одна владелица под девичьей и под мужней фамилией → каноническое написание (estate_of).
[owner_aliases]
"Анфисы Спиридоновны Маниловой" = "Анфисы Спиридоновны Плюшкиной"

# Владелица → род, в котором родилась (только для ранжирования пар estate-conflicts).
[maiden_families]
"Анфисы Спиридоновны Плюшкиной" = "Манилова"

# RTV001: владелец (ФАМИЛИЯ_ИНИЦИАЛЫ имени константы) → его селения и имя, как его пишет статус.
# Порядок значим: свободный текст ищет первого владельца, чьё имя в нём есть.
[landlords]
MANILOV_PS = { villages = ["Горюхино"], token = "Прохора Савельевича Манилова" }
MANILOV_LK = { villages = ["Горюхино"], token = "Лукерьи Кузьминичны Маниловой" }
MANILOV_SP = { villages = ["Горюхино"], token = "Саввы Пантелеевича Манилова" }
MANILOV_RS = { villages = ["Собакевичево"], token = "Родиона Степановича Манилова" }
MANILOV_OV = { villages = ["Собакевичево"], token = "Ольги Власьевны Маниловой" }
MANILOV_KF = { villages = ["Собакевичево"], token = "Кузьмы Филипповича Манилова" }
MANILOV_FL = { villages = ["Собакевичево"], token = "Фрола Лаврентьевича Манилова" }
MANILOV_NE = { villages = ["Собакевичево"], token = "Нила Евграфовича Манилова" }
# Два селения сверх своего: владелец, чьи крестьяне жили и в соседних деревнях.
SOBAKEVICH_TL = { villages = ["Собакевичево", "Дырявино", "Усть-Неурожайка"], token = "Трифона Лукича Собакевича" }
SOBAKEVICH_UK = { villages = ["Собакевичево"], token = "Ульяны Корнеевны Собакевич" }
SOBAKEVICH_EM = { villages = ["Собакевичево"], token = "Ермолая Минаевича Собакевича" }
PLJUSHKIN_AS = { villages = ["Собакевичево"], token = "Анфисы Спиридоновны Плюшкиной" }
PLJUSHKIN_GE = { villages = ["Собакевичево"], token = "Гурия Евсеевича Плюшкина" }
PENOCHKIN_IV = { villages = ["Собакевичево"], token = "Ивана Васильевича Пеночкина" }
SOBAKEVICH_ZP = { villages = ["Собакевичево"], token = "Захара Порфирьевича Собакевича" }

# RTV001: в книгах этих селений ясачные и казённые крестьяне жили в одном из них.
[[state_peasants]]
books = ["Горюхино", "Собакевичево"]
village = "Горюхино"
who = "ясачные и казённые крестьяне прихода"

# RTV002: в книгах прихода село — владельцев, деревня — казённая.
[[owners_and_state]]
parish = "Глуповы Горы"
owners = { village = "Глуповы Горы", in = "в Глуповых Горах" }
state = { village = "Горелово", in = "в Горелово" }

# Иное написание места (RTV).
[village_aliases]
"Горюхино СССР" = "Горюхино"
